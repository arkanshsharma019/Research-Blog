<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Brighter, more vibrant palette */
    --paper: #FFFFFF;          /* Pure white for a brighter background */
    --paper-raised: #FFF3C4;   /* Brighter pale yellow */
    --ink: #111827;            /* Darker, sharper text for contrast */
    --ink-soft: #4F46E5;       /* Bright indigo instead of muted purple */
    --rule: #D1D5DB;           /* Clean, light grey for dividers */
    --signal: #0EA5E9;         /* Vibrant sky blue */
    --pulse: #F97316;          /* Vibrant orange */
    --amber: #EF4444;          /* Bright red */
    --teal: #10B981;           /* Bright mint green */

    /* Typography */
    --display: 'Space Grotesk', 'IBM Plex Sans', sans-serif;
    --serif: 'IBM Plex Sans', Georgia, sans-serif;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', Georgia, sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--serif); -webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  ::selection{background:var(--amber); color:var(--paper);}
  a:focus-visible, button:focus-visible{outline:2px solid var(--teal); outline-offset:3px;}
  .wrap{max-width:1200px; /* Widened slightly to fit sidebars */ margin:0 auto; padding:0 28px;}

  header.masthead{border-bottom:1px solid var(--rule); border-top:3px solid var(--signal); padding:36px 0 0 0;}
  .masthead-row{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px; padding-bottom:22px;}
  .site-title{font-family:var(--serif); font-weight:600; font-size:1.9rem; letter-spacing:-0.01em; margin:0; cursor:pointer;}
  .site-title .dot{color:var(--amber);}
  nav.primary-nav{display:flex; gap:26px; font-family:var(--sans); font-size:0.92rem;}
  nav.primary-nav a{text-decoration:none; color:var(--ink-soft); padding-bottom:2px; border-bottom:1px solid transparent; cursor:pointer;}
  nav.primary-nav a.active, nav.primary-nav a:hover{color:var(--ink); border-bottom-color:var(--amber);}
  .masthead-meta{font-family:var(--mono); font-size:0.72rem; color:var(--ink-soft); display:flex; gap:18px; padding-bottom:14px;}

  main{padding:40px 0 100px; min-height:40vh;}

  /* --- NEW LAYOUT: LEFT SIDEBAR, CENTER, RIGHT SIDEBAR --- */
  .home-layout {
    display: grid;
    grid-template-columns: 220px 1fr 220px;
    gap: 40px;
  }
  
  @media (max-width: 960px) {
    .home-layout {
      grid-template-columns: 1fr; /* Stacks vertically on smaller screens */
    }
    .sidebar { display: none; } /* Optional: hides sidebars on mobile */
  }

  .hero{display:grid; grid-template-columns:1fr; gap:32px; padding-bottom:48px; border-bottom:1px solid var(--rule); margin-bottom:48px;}
  .hero h1{font-size:2.6rem; line-height:1.12; font-weight:500; margin:0 0 18px; letter-spacing:-0.01em; color:var(--ink);}
  .hero p.lede{font-size:1.08rem; color:var(--ink-soft); line-height:1.6; max-width:52ch; margin:0 0 20px;}
  .hero .cta{font-family:var(--sans); font-size:0.92rem; display:inline-flex; gap:8px; align-items:center; text-decoration:none; color:var(--paper); background:var(--ink); padding:10px 16px; cursor:pointer; border:none;}
  .hero .cta:hover{background:var(--teal);}
  
  .hero-side{font-family:var(--sans); font-size:0.88rem; color:var(--ink-soft); border-left:1px solid var(--rule); padding-left:28px;}
  .hero-side h2{font-family:var(--mono); font-size:0.72rem; color:var(--ink); margin:0 0 12px; font-weight:500;}
  .hero-side ul{list-style:none; margin:0; padding:0;}
  .hero-side li{padding:8px 0; border-bottom:1px dashed var(--rule);}
  .hero-side li:last-child{border-bottom:none;}

  .list-header{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:22px;}
  .list-header h2{font-size:1.15rem; font-weight:500; margin:0;}
  .list-header span{font-family:var(--mono); font-size:0.75rem; color:var(--ink-soft);}

  .entry{display:grid; grid-template-columns:88px 1fr; gap:24px; padding:22px 0; border-bottom:1px solid var(--rule); cursor:pointer;}
  .entry:first-of-type{border-top:1px solid var(--rule);}
  .entry:hover .entry-title{color:var(--amber);}
  .entry-num{font-family:var(--mono); font-size:0.78rem; color:var(--ink-soft); padding-top:3px;}
  .entry-title{font-size:1.28rem; font-weight:500; margin:0 0 8px; line-height:1.3; transition:color .15s ease;}
  .entry-abstract{color:var(--ink-soft); font-size:0.98rem; line-height:1.55; margin:0 0 10px; max-width:62ch;}
  .entry-meta{font-family:var(--sans); font-size:0.78rem; color:var(--ink-soft); display:flex; gap:14px; flex-wrap:wrap;}

  /* --- NEW SLIDESHOW STYLES --- */
  .slideshow-container {
    position: relative;
    width: 100%;
    height: 350px; 
    border: 1px solid var(--rule);
    overflow: hidden;
    background: #f4f4f4; /* placeholder color if image doesn't load */
  }
  
  .slideshow-container img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    animation: fadeCycle 12s infinite; /* 12 seconds total for 4 images */
  }

  /* Delay for each image to create the sequence */
  .slideshow-container img:nth-child(1) { animation-delay: 0s; }
  .slideshow-container img:nth-child(2) { animation-delay: 3s; }
  .slideshow-container img:nth-child(3) { animation-delay: 6s; }
  .slideshow-container img:nth-child(4) { animation-delay: 9s; }

  /* Animation logic for rotation */
  @keyframes fadeCycle {
    0%   { opacity: 0; }
    5%   { opacity: 1; }
    25%  { opacity: 1; }
    30%  { opacity: 0; }
    100% { opacity: 0; }
  }

  footer{border-top:1px solid var(--rule); padding:24px 0 40px; font-family:var(--mono); font-size:0.72rem; color:var(--ink-soft); display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .empty-note{font-family:var(--sans); color:var(--ink-soft); font-size:0.95rem; padding:30px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);}
  .loading, .error-note{font-family:var(--sans); color:var(--ink-soft); font-size:0.95rem; padding:30px 0;}
  .error-note{color:var(--amber);}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="masthead-row">
      <h1 class="site-title" data-nav="home">Research Notes<span class="dot">.</span></h1>
      <nav class="primary-nav">
        <a data-nav="home">Home</a>
        <a data-nav="archive">Archive</a>
        <a data-nav="about">About</a>
      </nav>
    </div>
    <div class="masthead-meta">
      <span id="meta-count">— posts</span>
    </div>
  </div>
</header>

<main class="wrap" id="app"><div class="loading">Loading…</div></main>

<footer class="wrap">
  <span>© <span id="year"></span> Research Notes.</span>
</footer>

<script>
const app = document.getElementById('app');
document.getElementById('year').textContent = new Date().getFullYear();

let manifestCache = null;
const postCache = {};

async function getManifest(){
  if(manifestCache) return manifestCache;
  const res = await fetch('posts.json');
  if(!res.ok) throw new Error('Could not load posts.json');
  const data = await res.json();
  manifestCache = [...data].sort((a,b)=> new Date(b.date) - new Date(a.date));
  return manifestCache;
}

function fmtDate(d){
  return new Date(d).toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'});
}

async function setMeta(){
  try{
    const posts = await getManifest();
    document.getElementById('meta-count').textContent = posts.length + (posts.length===1 ? ' post' : ' posts');
  }catch(e){ /* silent */ }
}

function entryHtml(p, i){
  return `
    <article class="entry" data-post="${p.id}">
      <div class="entry-num">${String(i+1).padStart(2,'0')}</div>
      <div>
        <h3 class="entry-title">${p.title}</h3>
        <div class="entry-meta">
          <span>${fmtDate(p.date)}</span>
        </div>
      </div>
    </article>
  `;
}

function emptyState(){
  return `<div class="empty-note">No posts yet — add a file to /posts and list it in posts.json to publish here.</div>`;
}

function errorNote(msg){
  return `<div class="error-note">${msg}</div>`;
}

async function renderHome(){
  try{
    const posts = await getManifest();
    const latest = posts.slice(0,4);
    
    // The new grid layout applies here
    app.innerHTML = `
      <div class="home-layout">
        
        <!-- LEFT SIDEBAR SLIDESHOW -->
        <aside class="sidebar sidebar-left">
          <div class="slideshow-container">
            <img src="a.png" alt="Slide 1">
            <img src="b.png" alt="Slide 2">
            <img src="c.png" alt="Slide 3">
            <img src="image_f75c47.png" alt="Slide 4">
          </div>
        </aside>

        <!-- CENTER MAIN CONTENT -->
        <div class="home-center">
          <section class="hero">
            <div>
              <h1>Every project has a story.</h1>
              <p class="lede">This is a collection of the work behind mine.</p>
              <button class="cta" data-nav="archive">Read the archive →</button>
            </div>
          </section>

          <div class="list-header">
            <h2>Recent posts</h2>
            <span>${posts.length} total</span>
          </div>
          ${posts.length ? posts.map(entryHtml).join('') : emptyState()}
        </div>

        <!-- RIGHT SIDEBAR SLIDESHOW -->
        <aside class="sidebar sidebar-right">
          <div class="slideshow-container">
            <img src="a.png" alt="Slide 1">
            <img src="b.png" alt="Slide 2">
            <img src="c.png" alt="Slide 3">
            <img src="image_f75c47.png" alt="Slide 4">
          </div>
        </aside>

      </div>
    `;
  }catch(e){
    app.innerHTML = errorNote('Could not load posts.json. Make sure it exists at the root of your site.');
  }
  attachHandlers();
}

async function renderArchive(){
  try{
    const posts = await getManifest();
    app.innerHTML = `
      <div class="list-header">
        <h2>Archive</h2>
        <span>${posts.length} total</span>
      </div>
      ${posts.length ? posts.map(entryHtml).join('') : emptyState()}
    `;
  }catch(e){
    app.innerHTML = errorNote('Could not load posts.json.');
  }
  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=> navigate(el.dataset.nav);
  });
  document.querySelectorAll('[data-post]').forEach(el=>{
    el.onclick = ()=> { location.hash = '#/post/' + el.dataset.post; };
  });
}

function highlightNav(route){
  document.querySelectorAll('nav.primary-nav a').forEach(a=>{
    a.classList.toggle('active', a.dataset.nav === route);
  });
}

function navigate(route){
  location.hash = route === 'home' ? '#/' : '#/' + route;
}

async function router(){
  const hash = location.hash || '#/';
  setMeta();
  if(hash === '#/' || hash === ''){
    await renderHome(); highlightNav('home');
  } else if(hash === '#/archive'){
    await renderArchive(); highlightNav('archive');
  } else {
    await renderHome(); highlightNav('home');
  }
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', router);
router();
</script>
</body>
</html>
