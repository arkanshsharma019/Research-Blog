<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Muted Scientific Palette (slightly brightened) */
    --paper: #ECECEC;          /* Lightened grey background */
    --paper-raised: #FFE4A3;   /* Slightly brighter pale yellow for code blocks/raised areas */
    --ink: #1A1A1A;            /* Dark grey for readable primary text */
    --ink-soft: #8B89C4;       /* Brighter muted purple for secondary text/meta */
    --rule: #7FACC0;           /* Brighter grey-blue for dividers and borders */
    --signal: #0C86D6;         /* Brighter muted blue for primary accents/headers */
    --pulse: #F0983A;          /* Brighter muted orange for interactive hovers */
    --amber: #D14A38;          /* Brighter muted red for active states and selections */
    --teal: #2AA362;           /* Brighter muted green for tags and alternate accents */

    /* Typography */
    --display: 'Space Grotesk', 'IBM Plex Sans', sans-serif;
    --serif: 'IBM Plex Sans', Georgia, sans-serif;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', Georgia, sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--serif); -webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  ::selection{background:var(--amber); color:var(--paper);}
  a:focus-visible, button:focus-visible{outline:2px solid var(--teal); outline-offset:3px;}
  .wrap{max-width:960px; margin:0 auto; padding:0 28px;}

  header.masthead{border-bottom:1px solid var(--rule); border-top:3px solid var(--signal); padding:36px 0 0 0;}
  .masthead-row{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px; padding-bottom:22px;}
  .site-title{font-family:var(--serif); font-weight:600; font-size:1.9rem; letter-spacing:-0.01em; margin:0; cursor:pointer;}
  .site-title .dot{color:var(--amber);}
  nav.primary-nav{display:flex; gap:26px; font-family:var(--sans); font-size:0.92rem;}
  nav.primary-nav a{text-decoration:none; color:var(--ink-soft); padding-bottom:2px; border-bottom:1px solid transparent; cursor:pointer;}
  nav.primary-nav a.active, nav.primary-nav a:hover{color:var(--ink); border-bottom-color:var(--amber);}
  .masthead-meta{font-family:var(--mono); font-size:0.72rem; color:var(--ink-soft); display:flex; gap:18px; padding-bottom:14px;}

  main{padding:40px 0 100px; min-height:40vh;}

  .hero{display:grid; grid-template-columns:1.3fr 1fr; gap:48px; padding-bottom:48px; border-bottom:1px solid var(--rule); margin-bottom:48px;}
  @media (max-width:760px){ .hero{grid-template-columns:1fr;} }
  .hero h1{font-size:2.6rem; line-height:1.12; font-weight:500; margin:0 0 18px; letter-spacing:-0.01em;}
  .hero p.lede{font-size:1.08rem; color:var(--ink-soft); line-height:1.6; max-width:52ch; margin:0 0 20px;}
  .hero .cta{font-family:var(--sans); font-size:0.92rem; display:inline-flex; gap:8px; align-items:center; text-decoration:none; color:var(--paper); background:var(--ink); padding:10px 16px; cursor:pointer; border:none;}
  .hero .cta:hover{background:var(--teal);}
  .hero-side{font-family:var(--sans); font-size:0.88rem; color:var(--ink-soft); border-left:1px solid var(--rule); padding-left:28px;}
  .hero-side h2{font-family:var(--mono); font-size:0.72rem; color:var(--ink); margin:0 0 12px; font-weight:500;}
  .hero-side ul{list-style:none; margin:0; padding:0;}
  .hero-side li{padding:8px 0; border-bottom:1px dashed var(--rule);}
  .hero-side li:last-child{border-bottom:none;}

  .list-header{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:22px;}
  .list-header h2{font-size:1.15rem; font-weight:500; margin:0;}
  .list-header span{font-family:var(--mono); font-size:0.75rem; color:var(--ink-soft);}

  .entry{display:grid; grid-template-columns:88px 1fr; gap:24px; padding:22px 0; border-bottom:1px solid var(--rule); cursor:pointer;}
  .entry:first-of-type{border-top:1px solid var(--rule);}
  .entry:hover .entry-title{color:var(--amber);}
  .entry-num{font-family:var(--mono); font-size:0.78rem; color:var(--ink-soft); padding-top:3px;}
  .entry-title{font-size:1.28rem; font-weight:500; margin:0 0 8px; line-height:1.3; transition:color .15s ease;}
  .entry-abstract{color:var(--ink-soft); font-size:0.98rem; line-height:1.55; margin:0 0 10px; max-width:62ch;}
  .entry-meta{font-family:var(--sans); font-size:0.78rem; color:var(--ink-soft); display:flex; gap:14px; flex-wrap:wrap;}
  .tag{font-family:var(--mono); font-size:0.72rem; color:var(--teal);}

  .post-head{border-bottom:1px solid var(--rule); padding-bottom:28px; margin-bottom:32px;}
  .back-link{font-family:var(--sans); font-size:0.85rem; color:var(--ink-soft); text-decoration:none; cursor:pointer; display:inline-block; margin-bottom:22px; background:none; border:none; padding:0;}
  .back-link:hover{color:var(--amber);}
  .post-meta-row{font-family:var(--mono); font-size:0.75rem; color:var(--ink-soft); display:flex; gap:16px; margin-bottom:16px; flex-wrap:wrap;}
  .post-head h1{font-size:2.2rem; font-weight:500; line-height:1.2; margin:0 0 16px; max-width:22ch;}
  .post-abstract{font-size:1.05rem; color:var(--ink-soft); line-height:1.65; max-width:64ch;}
  .post-body{max-width:68ch; font-size:1.08rem; line-height:1.75;}
  .post-body h2{font-size:1.35rem; font-weight:500; margin:38px 0 14px;}
  .post-body p{margin:0 0 18px;}
  .post-body blockquote{margin:26px 0; padding-left:20px; border-left:2px solid var(--amber); color:var(--ink-soft); font-style:italic;}
  .post-body code{font-family:var(--mono); background:var(--paper-raised); padding:2px 5px; font-size:0.9em; color:var(--ink);}
  .post-figure{margin:30px 0;}
  .post-figure img{width:100%; height:auto; display:block; border:1px solid var(--rule);}
  .post-figure figcaption{font-family:var(--sans); font-size:0.85rem; color:var(--ink-soft); margin-top:8px; line-height:1.5;}
  .post-foot{margin-top:48px; padding-top:22px; border-top:1px solid var(--rule); font-family:var(--sans); font-size:0.85rem; color:var(--ink-soft);}
  .post-foot a{cursor:pointer; color:var(--teal); text-decoration:none;}

  .profile-row{display:grid; grid-template-columns:220px 1fr; gap:44px; padding-bottom:36px; border-bottom:1px solid var(--rule); margin-bottom:36px;}
  @media (max-width:700px){ .profile-row{grid-template-columns:1fr; text-align:left;} }
  .profile-photo{width:220px; height:220px; object-fit:cover; border:1px solid var(--rule); filter:grayscale(15%);}
  @media (max-width:700px){ .profile-photo{width:150px; height:150px;} }
  .profile-info h1{font-size:2rem; font-weight:500; margin:0 0 4px; letter-spacing:-0.01em;}
  .profile-title{font-family:var(--sans); font-size:0.95rem; color:var(--signal); margin:0 0 18px;}
  .profile-info p{color:var(--ink-soft); line-height:1.7; font-size:1.02rem; margin:0 0 16px; max-width:58ch;}

  /* Contact Table Styles */
  .contact-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 28px;
    font-family: var(--sans);
    font-size: 0.95rem;
  }
  .contact-table tr {
    border-top: 1px solid var(--rule);
  }
  .contact-table tr:last-child {
    border-bottom: 1px solid var(--rule);
  }
  .contact-table td {
    padding: 14px 0;
    color: var(--ink);
  }
  .contact-table td:last-child {
    text-align: right;
  }
  .contact-table a {
    text-decoration: none;
    color: var(--teal);
    transition: color 0.15s ease;
  }
  .contact-table a:hover {
    color: var(--pulse);
  }

  .cv-tabs{display:flex; gap:2px; margin-bottom:28px; border-bottom:1px solid var(--rule); font-family:var(--sans);}
  .cv-tab{background:none; border:none; padding:10px 18px 12px; font-size:0.92rem; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; font-family:var(--sans);}
  .cv-tab:hover{color:var(--ink);}
  .cv-tab.active{color:var(--ink); border-bottom-color:var(--pulse);}
  .cv-panel{display:none;}
  .cv-panel.active{display:block;}
  .cv-item{display:grid; grid-template-columns:150px 1fr; gap:22px; padding:20px 0; border-bottom:1px solid var(--rule);}
  @media (max-width:700px){ .cv-item{grid-template-columns:1fr; gap:4px;} }
  .cv-item:first-child{border-top:1px solid var(--rule);}
  .cv-place{font-family:var(--sans); font-size:0.85rem; color:var(--signal); margin:0 0 8px;}
  .cv-period{font-family:var(--mono); font-size:0.76rem; color:var(--ink-soft); padding-top:2px; display:flex; flex-direction:column; align-items:flex-start; gap:10px;}
  .cv-logo{width:88px; height:88px; object-fit:contain;}
  .cv-item h3{font-size:1.05rem; font-weight:500; margin:0 0 5px; line-height:1.35;}
  .cv-note{color:var(--ink-soft); font-size:0.95rem; line-height:1.6; margin:0; max-width:60ch;}

  footer{border-top:1px solid var(--rule); padding:24px 0 40px; font-family:var(--mono); font-size:0.72rem; color:var(--ink-soft); display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .empty-note{font-family:var(--sans); color:var(--ink-soft); font-size:0.95rem; padding:30px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);}
  .loading, .error-note{font-family:var(--sans); color:var(--ink-soft); font-size:0.95rem; padding:30px 0;}
  .error-note{color:var(--amber);}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="masthead-row">
      <h1 class="site-title" data-nav="home">Research Notes<span class="dot">.</span></h1>
      <nav class="primary-nav">
        <a data-nav="home">Home</a>
        <a data-nav="archive">Archive</a>
        <a data-nav="about">About</a>
      </nav>
    </div>
    <div class="masthead-meta">
      <span id="meta-count">— posts</span>
    </div>
  </div>
</header>

<main class="wrap" id="app"><div class="loading">Loading…</div></main>

<footer class="wrap">
  <span>© <span id="year"></span> Research Notes.</span>
</footer>

<script>
/* ======================================================
   HOW TO ADD A NEW POST
   1. Create a new file in /posts/, e.g. posts/my-new-post.json
      Copy the structure of an existing file in that folder.
   2. Add one entry for it to posts.json (metadata only, no body).
   3. Upload both files to your GitHub repo. Done — no other
      file needs to change.
   ====================================================== */

const app = document.getElementById('app');
document.getElementById('year').textContent = new Date().getFullYear();

let manifestCache = null;
const postCache = {};

async function getManifest(){
  if(manifestCache) return manifestCache;
  const res = await fetch('posts.json');
  if(!res.ok) throw new Error('Could not load posts.json');
  const data = await res.json();
  manifestCache = [...data].sort((a,b)=> new Date(b.date) - new Date(a.date));
  return manifestCache;
}

async function getPost(id){
  if(postCache[id]) return postCache[id];
  const res = await fetch('posts/' + id + '.json');
  if(!res.ok) throw new Error('Could not load post: ' + id);
  const data = await res.json();
  postCache[id] = data;
  return data;
}

async function getAbout(){
  const res = await fetch('about.json');
  if(!res.ok) throw new Error('Could not load about.json');
  return res.json();
}

function fmtDate(d){
  return new Date(d).toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'});
}

async function setMeta(){
  try{
    const posts = await getManifest();
    document.getElementById('meta-count').textContent = posts.length + (posts.length===1 ? ' post' : ' posts');
    // last-updated meta removed
  }catch(e){ /* silent */ }
}

function entryHtml(p, i){
  return `
    <article class="entry" data-post="${p.id}">
      <div class="entry-num">${String(i+1).padStart(2,'0')}</div>
      <div>
        <h3 class="entry-title">${p.title}</h3>
        <div class="entry-meta">
          <span>${fmtDate(p.date)}</span>
        </div>
      </div>
    </article>
  `;
}

function emptyState(){
  return `<div class="empty-note">No posts yet — add a file to /posts and list it in posts.json to publish here.</div>`;
}

function errorNote(msg){
  return `<div class="error-note">${msg}</div>`;
}

async function renderHome(){
  try{
    const posts = await getManifest();
    const latest = posts.slice(0,4);
    app.innerHTML = `
      <section class="hero">
        <div>
          <h1>Notes from an ongoing research project.</h1>
          <p class="lede">Every project has a story. This is a collection of the work behind mine.</p>
          <button class="cta" data-nav="archive">Read the archive →</button>
        </div>
        <div class="hero-side">
          <h2>latest</h2>
          <ul>
            ${latest.map(p => `<li><a data-post="${p.id}" style="text-decoration:none;cursor:pointer;">${p.title}</a></li>`).join('') || '<li>No posts yet.</li>'}
          </ul>
        </div>
      </section>
      <div class="list-header">
        <h2>Recent posts</h2>
        <span>${posts.length} total</span>
      </div>
      ${posts.length ? posts.map(entryHtml).join('') : emptyState()}
    `;
  }catch(e){
    app.innerHTML = errorNote('Could not load posts.json. Make sure it exists at the root of your site.');
  }
  attachHandlers();
}

async function renderArchive(){
  try{
    const posts = await getManifest();
    app.innerHTML = `
      <div class="list-header">
        <h2>Archive</h2>
        <span>${posts.length} total</span>
      </div>
      ${posts.length ? posts.map(entryHtml).join('') : emptyState()}
    `;
  }catch(e){
    app.innerHTML = errorNote('Could not load posts.json.');
  }
  attachHandlers();
}

async function renderPost(id){
  try{
    const posts = await getManifest();
    const idx = posts.findIndex(p=>p.id===id);
    if(idx === -1){ await renderArchive(); return; }
    const p = await getPost(id);
    const bodyHtml = p.body.map(b=>{
      if(b.type==='h2') return `<h2>${b.text}</h2>`;
      if(b.type==='quote') return `<blockquote>${b.text}</blockquote>`;
      if(b.type==='image') return `<figure class="post-figure"><img src="${b.src}" alt="${b.alt||''}">${b.caption ? `<figcaption>${b.caption}</figcaption>` : ''}</figure>`;
      return `<p>${b.text}</p>`;
    }).join('');
    const prev = posts[idx+1];
    const next = posts[idx-1];
    app.innerHTML = `
      <button class="back-link" data-nav="archive">← Back to archive</button>
      <div class="post-head">
        <div class="post-meta-row">
          <span>${fmtDate(p.date)}</span>
        </div>
        <h1>${p.title}</h1>
      </div>
      <div class="post-body">${bodyHtml}</div>
      <div class="post-foot">
        ${prev ? `<div>Next: <a data-post="${prev.id}">${prev.title}</a></div>` : ''}
        ${next ? `<div style="margin-top:6px;">Previous: <a data-post="${next.id}">${next.title}</a></div>` : ''}
      </div>
    `;
  }catch(e){
    app.innerHTML = errorNote('Could not load this post. Check that posts/' + id + '.json exists.');
  }
  attachHandlers();
}

function cvItem(period, title, place, note, image){
  return `
    <div class="cv-item">
      <div class="cv-period">
        ${image ? `<img class="cv-logo" src="${image}" alt="">` : ''}
        <span>${period}</span>
      </div>
      <div>
        <h3>${title}</h3>
        <p class="cv-place">${place}</p>
        ${note ? `<p class="cv-note">${note}</p>` : ''}
      </div>
    </div>
  `;
}

async function renderAbout(){
  try{
    const about = await getAbout();

    app.innerHTML = `
      <div class="profile-row">
        <img class="profile-photo" src="${about.photo}" alt="${about.name}">
        <div class="profile-info">
          <h1>${about.name}</h1>
          ${about.title ? `<p class="profile-title">${about.title}</p>` : ''}
          <p>${about.bio}</p>

          <table class="contact-table">
            <tbody>
              ${about.contacts.map(c=>`
                <tr>
                  <td>${c.label}</td>
                  <td><a href="${c.href}" target="_blank" rel="noopener">${c.value}</a></td>
                </tr>
              `).join('')}
            </tbody>
          </table>

        </div>
      </div>

      <div class="cv-tabs">
        <button class="cv-tab active" data-tab="education">Education</button>
        <button class="cv-tab" data-tab="research">Research Experience</button>
        <button class="cv-tab" data-tab="awards">Awards</button>
      </div>

      <div class="cv-panel active" id="panel-education">
        ${about.education.map(e=>cvItem(e.period, e.degree, e.place, e.note, e.image)).join('')}
      </div>
      <div class="cv-panel" id="panel-research">
        ${about.research.map(r=>cvItem(r.period, r.role, r.place, r.note, r.image)).join('')}
      </div>
      <div class="cv-panel" id="panel-awards">
        ${about.awards.map(a=>cvItem(a.period, a.title, a.place, a.note, a.image)).join('')}
      </div>
    `;
    document.querySelectorAll('.cv-tab').forEach(btn=>{
      btn.onclick = ()=>{
        document.querySelectorAll('.cv-tab').forEach(b=>b.classList.remove('active'));
        document.querySelectorAll('.cv-panel').forEach(p=>p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
      };
    });
  }catch(e){
    app.innerHTML = errorNote('Could not load about.json.');
  }
  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=> navigate(el.dataset.nav);
  });
  document.querySelectorAll('[data-post]').forEach(el=>{
    el.onclick = ()=> { location.hash = '#/post/' + el.dataset.post; };
  });
}

function highlightNav(route){
  document.querySelectorAll('nav.primary-nav a').forEach(a=>{
    a.classList.toggle('active', a.dataset.nav === route);
  });
}

function navigate(route){
  location.hash = route === 'home' ? '#/' : '#/' + route;
}

async function router(){
  const hash = location.hash || '#/';
  setMeta();
  if(hash === '#/' || hash === ''){
    await renderHome(); highlightNav('home');
  } else if(hash === '#/archive'){
    await renderArchive(); highlightNav('archive');
  } else if(hash === '#/about'){
    await renderAbout(); highlightNav('about');
  } else if(hash.startsWith('#/post/')){
    await renderPost(hash.replace('#/post/',''));
    highlightNav('');
  } else {
    await renderHome(); highlightNav('home');
  }
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', router);
router();
</script>
</body>
</html>
